version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: railway_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-railway_db}
      MYSQL_USER: ${DB_USER:-railway_user}
      MYSQL_PASSWORD: ${DB_PASS:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - railway_network

  # Flask Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway_backend
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key}
      DB_HOST: mysql
      DB_USER: ${DB_USER:-railway_user}
      DB_PASS: ${DB_PASS:-password}
      DB_NAME: ${DB_NAME:-railway_db}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-key}
    ports:
      - "5001:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - railway_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway_frontend
    # Frontend is now a static build served by nginx; env handled at build time
    ports:
      - "5173:80"
    depends_on:
      - backend
    # Remove bind mounts for production image immutability
    networks:
      - railway_network

volumes:
  mysql_data:

networks:
  railway_network:
    driver: bridge
